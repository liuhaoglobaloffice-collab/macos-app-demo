name: Hermes Codex Automation

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task description for Hermes (what to fix or implement)'
        required: true
      max_iter:
        description: 'Maximum iterations'
        required: false
        default: '3'

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --upgrade pip && pip install openai pytest || true
      - name: Run Hermes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL }}
        run: |
          python scripts/hermes/hermes.py --task "${{ github.event.inputs.task }}" --max-iter ${{ github.event.inputs.max_iter }}

# Note: Repository secret OPENAI_API_KEY must be set for this workflow to work.
